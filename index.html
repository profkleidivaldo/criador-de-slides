<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aula Criativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600;700&family=Lexend:wght@400;600&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Cinzel:wght@600;800&family=Playfair+Display:wght@700;900&family=Merriweather:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2147;--mut:#6c7396;--line:#e3e6f3;--bg:#eef0f9;--acc:#5b5bf0;--acc2:#8b5cf6;--ok:#10b981}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:block;flex:none}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;height:100vh}
.top{height:62px;display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:10px;margin-right:12px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6d5dfc,#ff7eb3);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(109,93,252,.35)}
.brand b{display:block;font-size:16px;font-weight:800;line-height:1.1}
.brand small{color:var(--mut);font-size:11.5px;font-weight:600}
.dtitle{border:2px solid transparent;background:#f4f5fc;border-radius:10px;padding:9px 12px;font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);width:min(340px,28vw);outline:none}
.dtitle:hover{border-color:var(--line)}
.dtitle:focus{border-color:var(--acc);background:#fff}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink);padding:0}
.ib:hover:not(:disabled){background:#f1f2fd}
.ib:disabled{opacity:.35;cursor:default}
.fsize{font-size:12px;font-weight:700;color:var(--mut);padding:0 6px;white-space:nowrap}
.fsize.warn{color:#d9480f}
.btn{display:flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:10px 16px;font-weight:800;color:#fff;white-space:nowrap}
.btn.play{background:linear-gradient(135deg,#6d5dfc,#8b5cf6);box-shadow:0 6px 16px rgba(109,93,252,.35)}
.btn.save{background:linear-gradient(135deg,#10b981,#06a77d);box-shadow:0 6px 16px rgba(16,185,129,.3)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost .ic{color:var(--acc)}
.btn:hover{filter:brightness(1.07)}

.ribbon{display:flex;align-items:stretch;gap:4px;padding:8px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:74px;padding:8px 10px;border:0;background:transparent;border-radius:12px;font-weight:700;font-size:12px}
.rb:hover{background:#f1f2fd}
.rb .ic{color:var(--acc)}
.rsep{width:1px;background:var(--line);margin:4px 8px}
.rhint{margin-left:auto;align-self:center;color:var(--mut);font-size:12.5px;font-weight:600}

.work{flex:1;display:grid;grid-template-columns:212px 1fr 316px;min-height:0}
.slides{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#slist{flex:1;overflow:auto;padding:12px 10px}
.sitem{display:flex;gap:6px;align-items:flex-start;padding:6px;border-radius:12px;margin-bottom:6px;position:relative;cursor:pointer;border:2px solid transparent}
.sitem:hover{background:#f5f6fd}
.sitem.on{background:#eef0ff;border-color:var(--acc)}
.sitem.over{box-shadow:0 -3px 0 var(--acc)}
.num{font-size:11px;font-weight:800;color:var(--mut);width:16px;padding-top:2px;flex:none}
.sprev{border-radius:7px;overflow:hidden;box-shadow:0 2px 8px rgba(30,30,80,.2);flex:none}
.tw{position:relative;overflow:hidden}
.tw .slide{transform-origin:0 0}
.sact{position:absolute;right:8px;top:8px;display:none;gap:3px}
.sitem:hover .sact{display:flex}
.sact button{width:24px;height:24px;border-radius:7px;border:0;background:rgba(255,255,255,.96);box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center;padding:0;color:var(--ink)}
.addsl{margin:10px;padding:11px;border-radius:12px;border:2px dashed #c5c9ee;background:#f7f8ff;font-weight:800;color:var(--acc);display:flex;align-items:center;justify-content:center;gap:6px}
.addsl:hover{background:#eef0ff}

.canvas{position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#f8f9ff,#e5e8f6)}
.stagebox{position:relative;box-shadow:0 20px 50px rgba(40,40,100,.25);border-radius:4px}

/* ---------- slide ---------- */
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;transform-origin:0 0;user-select:none;-webkit-user-select:none}
.slide.edit{overflow:visible}
.slide.thumb{pointer-events:none}
.slide .deco{position:absolute;inset:0;pointer-events:none}
.slide .deco svg{width:100%;height:100%;display:block}
.el{position:absolute;box-sizing:border-box}
.slide.edit .el{cursor:move}
.slide.edit .el:hover{outline:2px dashed rgba(91,91,240,.55);outline-offset:2px}
.el .tx{outline:none}
.slide .tx[contenteditable=true]{user-select:text;-webkit-user-select:text;cursor:text}
.el-title{display:flex;align-items:center;justify-content:center}
.el-title .tx{width:100%;font-weight:800;letter-spacing:.01em;line-height:1.1;overflow-wrap:break-word;caret-color:#333}
.ts-bubble .tx{color:var(--c1);-webkit-text-stroke:.16em var(--c2);paint-order:stroke fill;text-shadow:0 .07em 0 rgba(0,0,0,.2)}
.ts-d3 .tx{color:var(--c1);text-shadow:.02em .02em 0 var(--c2),.04em .04em 0 var(--c2),.06em .06em 0 var(--c2),.08em .08em 0 var(--c2),.1em .1em 0 var(--c2),.12em .12em 0 var(--c2),.14em .14em 0 var(--c2),.17em .17em .06em rgba(0,0,0,.35)}
.ts-rainbow .tx{background:linear-gradient(90deg,#ff4d6d,#ff9f1c,#2ec4b6,#3a86ff,#8338ec,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 .05em 0 rgba(0,0,0,.2))}
.ts-neon .tx{color:#fff;text-shadow:0 0 .06em #fff,0 0 .15em var(--c1),0 0 .3em var(--c1),0 0 .6em var(--c1)}
.ts-banner .tx{background:var(--c2);color:var(--c1);border-radius:.3em;box-shadow:0 .09em 0 rgba(0,0,0,.22);padding:.12em .5em;width:100%}
.ts-chalk .tx{color:var(--c1);font-weight:700;text-shadow:0 0 .03em #fff,.02em .03em .05em rgba(255,255,255,.45)}
.ts-plain .tx{color:var(--c1)}
.ts-classic .tx{color:var(--c1);text-shadow:0 .03em 0 var(--c2),0 .06em .12em rgba(0,0,0,.28)}
.ts-gold .tx{background:linear-gradient(180deg,#fff3b8 0%,#f6c945 42%,#b27a14 52%,#f3d27a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 .04em 0 var(--c2)) drop-shadow(0 .07em .08em rgba(0,0,0,.45))}
.ts-ruled .tx{color:var(--c1);border-bottom:.06em solid var(--c2);padding-bottom:.14em}
.el-text .tx{padding:14px 20px;min-height:100%;overflow-wrap:break-word}
.el-text .tx>div,.el-text .tx>p{margin:.12em 0}
.el-text.bul .tx>div,.el-text.bul .tx>p{display:list-item;list-style:disc outside;margin-left:1.3em}
.el-text.num .tx>div,.el-text.num .tx>p{display:list-item;list-style:decimal outside;margin-left:1.5em}
.el-image img{width:100%;height:100%;display:block;-webkit-user-drag:none}
.el-video{background:#000;overflow:hidden}
.el-video video,.el-video iframe{width:100%;height:100%;border:0;background:#000;display:block}
.vtile{position:absolute;inset:0;background:linear-gradient(135deg,#25295c,#4a2c82);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:800;font-size:24px}
.el-audio .cap{position:absolute;inset:0;display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:0 26px;font-weight:800;font-size:24px;color:#1d2147}
.el-audio audio{flex:1;height:48px;min-width:0}
.el-shape svg{width:100%;height:100%;overflow:visible;display:block}
.el-shape svg *{vector-effect:non-scaling-stroke;stroke-linejoin:round}
.el-sticker{display:flex;align-items:center;justify-content:center;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ph{position:absolute;inset:0;border:3px dashed rgba(29,33,71,.35);border-radius:20px;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#475069;font-weight:800;font-size:22px;text-align:center;padding:16px}
.slide.edit .el-video>*,.slide.edit .el-audio>*,.slide.edit .el-image>*{pointer-events:none}
.selbox{position:absolute;border:calc(2px*var(--inv,1)) solid #5b5bf0;pointer-events:none;z-index:9999}
.hd{position:absolute;width:calc(14px*var(--inv,1));height:calc(14px*var(--inv,1));margin:calc(-7px*var(--inv,1));background:#fff;border:calc(2px*var(--inv,1)) solid #5b5bf0;border-radius:50%;pointer-events:auto}
.hd-nw{left:0;top:0;cursor:nwse-resize}.hd-n{left:50%;top:0;cursor:ns-resize}.hd-ne{left:100%;top:0;cursor:nesw-resize}
.hd-e{left:100%;top:50%;cursor:ew-resize}.hd-se{left:100%;top:100%;cursor:nwse-resize}.hd-s{left:50%;top:100%;cursor:ns-resize}
.hd-sw{left:0;top:100%;cursor:nesw-resize}.hd-w{left:0;top:50%;cursor:ew-resize}
.hd-rot{left:50%;top:calc(-34px*var(--inv,1));background:#5b5bf0;cursor:grab}
.guide{position:absolute;background:#ff3d81;pointer-events:none;display:none;z-index:9998}
.gv{left:639px;top:0;width:2px;height:720px}
.gh{top:359px;left:0;height:2px;width:1280px}

/* ---------- properties ---------- */
.props{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px 16px 28px}
.phead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:8px}
.phead .ic{color:var(--acc)}
.hint{font-size:12.5px;color:var(--mut);font-weight:600;line-height:1.45;background:#f6f7ff;border-radius:10px;padding:9px 11px;margin-bottom:6px}
.sec{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:6px}
.sec h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800}
.row{margin-bottom:12px}
.row>label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.fld,textarea.fld{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
textarea.fld{resize:vertical;min-height:80px}
.seg{display:flex;background:#f1f2fb;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;font-weight:800;font-size:12.5px;display:grid;place-items:center;color:var(--mut)}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 4px rgba(40,40,100,.18)}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--acc);min-width:0}
.rng output{min-width:44px;text-align:right;font-weight:800;font-size:12.5px}
.clr{display:flex;align-items:center;gap:8px}
.sws{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfd3ea;padding:0}
.sw.none{background:linear-gradient(135deg,#fff 45%,#e5484d 45% 55%,#fff 55%)}
.clr input[type=color],.two input[type=color]{width:36px;height:30px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.btn2{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;margin-bottom:8px}
.btn2:hover{background:#f4f5ff}
.btn2.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn2.pri:hover{filter:brightness(1.08);background:var(--acc)}
.btn2.dng{color:#d6336c}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tsg,.thg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tgh{grid-column:1/-1;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 0}
.tsb{border:2px solid var(--line);border-radius:12px;background:#6f9be0;height:62px;display:grid;place-items:center;overflow:hidden;padding:0}
.tsb.on,.thm.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(91,91,240,.2)}
.thm{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:#fff;text-align:left}
.thm .pv{height:60px;position:relative}
.thm .pv svg{position:absolute;inset:0;width:100%;height:100%}
.thm span{display:block;padding:5px 8px;font-size:12px;font-weight:800}

/* ---------- overlays ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(20,20,50,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:5000}
.modal{background:#fff;border-radius:20px;padding:22px 24px;width:min(540px,92vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{width:min(900px,94vw)}
.modal h3{margin:0 0 14px;font-size:20px}
.modal p{color:var(--mut);font-weight:600;line-height:1.5;margin:8px 0}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.mact .btn2{width:auto;margin:0;padding:9px 18px}
.or{text-align:center;color:var(--mut);font-weight:800;font-size:12px;margin:12px 0}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tpl{border:2px solid var(--line);border-radius:14px;background:#fff;padding:8px;text-align:left;font-weight:800}
.tpl:hover{border-color:var(--acc);background:#f7f8ff}
.tpl .tw{border-radius:8px;margin-bottom:8px;box-shadow:0 2px 8px rgba(30,30,80,.2)}
.pop{position:fixed;z-index:4000;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(30,30,80,.3);border:1px solid var(--line);padding:12px;width:330px;max-height:62vh;overflow:auto}
.shg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shb{height:64px;border:1.5px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;padding:0}
.shb:hover{background:#f1f2fd;border-color:var(--acc)}
.shb svg{width:34px;height:34px;fill:#8b5cf6;stroke:#4c3bb3;stroke-width:3}
.emh{font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 4px}
.emg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.emg button{font-size:26px;border:0;background:transparent;border-radius:8px;padding:4px;line-height:1.2}
.emg button:hover{background:#eef0ff}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:6000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1d2147;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* ---------- player ---------- */
.player{position:fixed;inset:0;background:#0b0c1a;z-index:3000;overflow:hidden;touch-action:pan-y;outline:none}
.pstage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}
.pstage .slide{box-shadow:0 0 80px rgba(0,0,0,.6)}
.pbar{position:absolute;left:0;top:0;height:5px;width:100%;background:rgba(255,255,255,.12);z-index:3}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d5dfc,#ff7eb3);transition:width .35s}
.pnav{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;z-index:3;backdrop-filter:blur(6px);transition:opacity .3s;padding:0}
.pnav:hover{background:rgba(255,255,255,.3)}
.pl{left:18px}.pr{right:18px}
.pctl{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:rgba(20,20,40,.72);backdrop-filter:blur(8px);padding:6px 10px;border-radius:999px;color:#fff;z-index:3;transition:opacity .3s;font-weight:800}
.pctl button{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:#fff;padding:7px 11px;border-radius:999px;font-weight:800}
.pctl button:hover{background:rgba(255,255,255,.2)}
.pcnt{padding:0 8px}
.player.idle .pnav,.player.idle .pctl{opacity:0;pointer-events:none}
.player.idle{cursor:none}
.pnotes{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);width:min(900px,90vw);background:rgba(255,255,255,.96);color:#1d2147;border-radius:16px;padding:14px 18px;font-weight:600;font-size:18px;line-height:1.5;z-index:3;display:none;white-space:pre-wrap}
.pnotes.on{display:block}
@media (max-width:720px),(max-height:420px){.pnav{width:38px;height:38px}.pl{left:6px}.pr{right:6px}.pctl{bottom:6px;padding:2px 6px;gap:2px;font-size:12px}.pctl button{padding:5px 8px}.pnotes{font-size:14px;bottom:52px}}
@keyframes a-fade{from{opacity:0}to{opacity:1}}
@keyframes a-slide{from{opacity:0;transform:translateX(90px)}to{opacity:1;transform:none}}
@keyframes a-slideb{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes a-zoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
</style>
</head>

(function(){

/* ---------- arquivos ---------- */
const readDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
const loadImage=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
function pick(accept,multi){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multi;i.onchange=()=>res([].slice.call(i.files));i.click();});}
async function imageAsset(file,max){
  max=max||1600;let data=await readDataURL(file);const im=await loadImage(data);
  let w=im.naturalWidth||im.width,hh=im.naturalHeight||im.height;const keep=file.type==='image/gif'||file.type==='image/svg+xml';
  if(!keep){
    const r=Math.min(1,max/Math.max(w,hh));const cw=Math.max(1,Math.round(w*r)),ch=Math.max(1,Math.round(hh*r));
    const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(im,0,0,cw,ch);
    let out=c.toDataURL('image/webp',.86);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.86);
    if(!(r===1&&out.length>=data.length))data=out;
  }
  const id='a'+uid();state.assets[id]=data;return {id:id,w:w,h:hh};
}
function mediaURL(id){
  if(blobs[id])return blobs[id];const d=state.assets[id];if(!d)return '';
  const m=/^data:([^;,]+)(;base64)?,/.exec(d);if(!m)return d;
  try{const bin=atob(d.slice(m[0].length));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return blobs[id]=URL.createObjectURL(new Blob([u],{type:m[1]}));}catch(e){return d;}
}
function usedAssets(){const u=new Set();state.slides.forEach(s=>{s.els.forEach(e=>{if(e.asset)u.add(e.asset);});if(s.bgo&&s.bgo.asset)u.add(s.bgo.asset);});return u;}
function sizeBytes(){let n=JSON.stringify(state.slides).length+80000;usedAssets().forEach(k=>{n+=(state.assets[k]||'').length;});return n;}
const fmtSize=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB';

/* ---------- fundo e renderização do slide ---------- */
function slideBg(sl){
  const o=sl.bgo,T=THEMES[sl.theme]||THEMES.sky;
  if(!o)return {bg:T.bg,deco:T.deco};
  if(o.t==='color')return {bg:o.v,deco:''};
  if(o.t==='grad')return {bg:'linear-gradient('+(o.ang||135)+'deg,'+o.a+','+o.b+')',deco:''};
  if(o.t==='img'&&state.assets[o.asset])return {bg:'#222 center/cover no-repeat url("'+state.assets[o.asset]+'")',deco:''};
  return {bg:T.bg,deco:T.deco};
}
function applyBgTo(n,sl){
  const bg=slideBg(sl);n.style.background=bg.bg;let d=n.querySelector(':scope>.deco');
  if(bg.deco){if(!d){d=h('div','deco');n.insertBefore(d,n.firstChild);}d.innerHTML=bg.deco;}else if(d)d.remove();
}
function placeholder(kind,text){return h('div','ph',ic(kind,44)+'<span>'+text+'</span>');}
function buildNode(el,mode){
  const n=h('div','el el-'+el.type);n.dataset.id=el.id;
  switch(el.type){
  case 'title':case 'text':n.appendChild(h('div','tx',el.html));break;
  case 'image':
    if(el.asset&&state.assets[el.asset]){const im=document.createElement('img');im.draggable=false;im.alt='';im.src=state.assets[el.asset];n.appendChild(im);}
    else if(mode==='edit')n.appendChild(placeholder('image','Dê dois cliques para escolher uma imagem'));
    else n.dataset.empty='1';
    break;
  case 'video':{
    const empty=!(el.asset&&state.assets[el.asset])&&!el.src;
    if(empty){if(mode==='edit')n.appendChild(placeholder('video','Dê dois cliques para adicionar um vídeo'));else n.dataset.empty='1';}
    else if(mode!=='play')n.appendChild(h('div','vtile',ic('play',54)+'<span>'+esc(el.name||'Vídeo')+'</span>'));
    else if(el.kind==='embed'){const f=document.createElement('iframe');f.src=el.src;f.allow='accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.setAttribute('frameborder','0');f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');n.appendChild(f);}
    else{const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='metadata';v.src=el.kind==='file'?mediaURL(el.asset):el.src;n.appendChild(v);}
    break;}
  case 'audio':{
    const empty=!(el.asset&&state.assets[el.asset]);
    if(empty){if(mode==='edit')n.appendChild(placeholder('audio','Dê dois cliques para escolher um áudio'));else n.dataset.empty='1';}
    else{const c=h('div','cap');if(mode==='play'){c.innerHTML=ic('audio',28);const a=document.createElement('audio');a.controls=true;a.src=mediaURL(el.asset);c.appendChild(a);}else c.innerHTML=ic('audio',28)+'<span>'+esc(el.name||'Áudio')+'</span>';n.appendChild(c);}
    break;}
  case 'shape':n.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none">'+(SHAPES[el.kind]||SHAPES.rect)+'</svg>';break;
  case 'sticker':n.textContent=el.ch;break;
  }
  return n;
}
const FRAMES={none:'none',shadow:'0 12px 32px rgba(0,0,0,.3)',border:'0 0 0 10px #fff,0 14px 34px rgba(0,0,0,.3)'};
function styleNode(n,e){
  const s=n.style;
  s.left=e.x+'px';s.top=e.y+'px';s.width=e.w+'px';s.height=e.h+'px';
  s.transform=e.rot?'rotate('+e.rot+'deg)':'none';s.opacity=e.op;
  if(n.dataset.empty)s.display='none';
  const ph=n.querySelector('.ph');if(ph)ph.style.borderRadius=(e.radius||20)+'px';
  switch(e.type){
  case 'title':{
    n.className='el el-title ts-'+e.ts;s.setProperty('--c1',e.c1);s.setProperty('--c2',e.c2);
    const t=n.firstChild;t.style.fontFamily=e.font;t.style.fontSize=e.size+'px';t.style.textAlign=e.align;break;}
  case 'text':{
    n.className='el el-text'+(e.list==='ul'?' bul':e.list==='ol'?' num':'');
    const t=n.firstChild;t.style.fontFamily=e.font;t.style.fontSize=e.size+'px';t.style.textAlign=e.align;t.style.color=e.color;t.style.lineHeight=e.lh;
    t.style.fontWeight=e.bold?'800':'600';t.style.fontStyle=e.italic?'italic':'normal';t.style.textDecoration=e.underline?'underline':'none';
    s.background=e.bg?rgba(e.bg,e.bgop):'transparent';s.borderRadius=e.radius+'px';s.boxShadow=e.bg?'0 8px 24px rgba(0,0,0,.14)':'none';break;}
  case 'image':{const im=n.querySelector('img');if(im){im.style.objectFit=e.fit;im.style.borderRadius=e.radius+'px';im.style.boxShadow=FRAMES[e.frame]||'none';}break;}
  case 'video':s.borderRadius=e.radius+'px';s.boxShadow=FRAMES[e.frame]||'none';break;
  case 'shape':{const sv=n.firstChild;sv.style.fill=e.fill;sv.style.stroke=e.sw?e.stroke:'none';sv.style.strokeWidth=e.sw+'px';break;}
  case 'sticker':s.fontSize=(Math.min(e.w,e.h)*.8)+'px';break;
  }
}
function renderSlideNode(sl,mode){
  const n=h('div','slide '+mode);applyBgTo(n,sl);
  sl.els.forEach((e,i)=>{const en=buildNode(e,mode);styleNode(en,e);en.style.zIndex=i+1;n.appendChild(en);});
  return n;
}
function thumb(sl,w){const t=h('div','tw');t.style.width=w+'px';t.style.height=(w*9/16)+'px';const n=renderSlideNode(sl,'thumb');n.style.transform='scale('+(w/W)+')';t.appendChild(n);return t;}

/* ---------- histórico ---------- */
function commit(){
  hist=hist.slice(0,hi+1);hist.push(JSON.stringify(state.slides));if(hist.length>80)hist.shift();hi=hist.length-1;
  unsaved=true;updateUndo();clearTimeout(tmr);tmr=setTimeout(()=>{refreshThumb(cur);updateSize();autosave();},250);
}
function restore(){
  endEdit();state.slides=JSON.parse(hist[hi]);cur=Math.min(cur,state.slides.length-1);if(!findEl(selId))selId=null;
  renderAll();updateSize();updateUndo();unsaved=true;
}
function undo(){if(hi>0){hi--;restore();}}
function redo(){if(hi<hist.length-1){hi++;restore();}}
function updateUndo(){const u=$('#bUndo'),r=$('#bRedo');if(u)u.disabled=hi<=0;if(r)r.disabled=hi>=hist.length-1;}
function updateSize(){const n=sizeBytes(),f=$('#fsize');if(!f)return;f.textContent='≈ '+fmtSize(n);f.classList.toggle('warn',n>25e6);f.title=n>25e6?'Arquivo grande: prefira links de vídeo ou vídeos menores':'Tamanho aproximado do arquivo salvo';}
const AK='aula-criativa-rascunho-v1';
function autosave(){
  if(sizeBytes()>4.5e6)return;
  try{localStorage.setItem(AK,JSON.stringify({t:Date.now(),state:{title:state.title,slides:state.slides,assets:Object.fromEntries([...usedAssets()].map(k=>[k,state.assets[k]]))}}));}
  catch(e){if(!warned){warned=true;toast('Rascunho automático indisponível neste navegador. Use "Salvar aula".');}}
}
function toast(msg){const t=h('div','toast');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),3200);}

/* ---------- modal e popover ---------- */
function modal(title,body,actions,wide){
  const ov=h('div','modal-ov'),m=h('div','modal'+(wide?' wide':''));m.appendChild(h('h3','',title));m.appendChild(body);
  const close=()=>ov.remove();
  if(actions&&actions.length){const a=h('div','mact');actions.forEach(x=>{const b=h('button','btn2'+(x.pri?' pri':''),x.label);b.onclick=()=>{close();x.fn&&x.fn();};a.appendChild(b);});m.appendChild(a);}
  ov.appendChild(m);ov.addEventListener('pointerdown',e=>{if(e.target===ov)close();});$('#app').appendChild(ov);return close;
}
let popEl=null,popOff=null;
function closePop(){if(popEl){popEl.remove();popEl=null;}if(popOff){document.removeEventListener('pointerdown',popOff,true);popOff=null;}}
function popover(anchor,content){
  closePop();const p=h('div','pop');p.appendChild(content);$('#app').appendChild(p);popEl=p;
  const r=anchor.getBoundingClientRect();p.style.left=clamp(r.left,8,Math.max(8,innerWidth-p.offsetWidth-8))+'px';p.style.top=(r.bottom+6)+'px';
  popOff=e=>{if(!p.contains(e.target)&&!anchor.contains(e.target))closePop();};setTimeout(()=>document.addEventListener('pointerdown',popOff,true),0);
}

/* ---------- edição de elementos ---------- */
function addEl(el,edit){
  const sl=slide();sl.els.push(el);const n=buildNode(el,'edit');styleNode(n,el);n.style.zIndex=sl.els.length;stageSlide.appendChild(n);
  select(el.id,true);commit();if(edit)startEdit(el.id);
}
function rebuildNode(id){
  const e=findEl(id),old=nodeOf(id);if(!e||!old)return;

function trackPointer(mv,up){
  const m=e=>mv(e),u=e=>{removeEventListener('pointermove',m);removeEventListener('pointerup',u);removeEventListener('pointercancel',u);up(e);};

    if(Math.abs(ny+el.h/2-H/2)<8){ny=H/2-el.h/2;gy=true;}
    el.x=Math.round(nx);el.y=Math.round(ny);styleNode(node,el);updateSel();guides(gx,gy);
  },()=>{guides(false,false);if(moved)commit();});
}
function startResize(ev,dir){

    return;

  const sx={nw:-1,n:0,ne:1,e:1,se:1,s:0,sw:-1,w:-1}[dir],sy={nw:-1,n:-1,ne:-1,e:0,se:1,s:1,sw:1,w:0}[dir];

    let s=sec('Estilo do título');const g=h('div','tsg');
    TSTYLES.forEach(t=>{
      const b=h('button','tsb'+(el.ts===t[0]?' on':''));b.type='button';b.title=t[1];
      b.style.background=slideBg(slide()).bg;const d=h('div','el el-title ts-'+t[0]);d.style.position='static';d.style.setProperty('--c1',el.c1);d.style.setProperty('--c2',el.c2);
      const x=h('div','tx','Aa');x.style.fontSize='30px';x.style.fontFamily=el.font;x.style.width='auto';d.appendChild(x);b.appendChild(d);
      b.onclick=()=>{up({ts:t[0]});buildPanel();};g.appendChild(b);
    });
    s.appendChild(g);p.appendChild(s);
    s=sec('Cores');s.appendChild(row('Cor principal',colorCtl(()=>el.c1,(c,f)=>up({c1:c||'#ffffff'},f))));s.appendChild(row('Contorno / sombra',colorCtl(()=>el.c2,(c,f)=>up({c2:c||'#ffffff'},f))));p.appendChild(s);
    s=sec('Texto');s.appendChild(fontSel());s.appendChild(row('Tamanho',range(40,200,2,()=>el.size,(v,f)=>up({size:v},f),v=>v+' px')));s.appendChild(alignSeg());p.appendChild(s);

  if(el.type==='text'){
    let s=sec('Texto');s.appendChild(fontSel());
    s.appendChild(row('Tamanho',seg([[32,'Pequeno'],[40,'Médio'],[52,'Grande'],[68,'Enorme']],()=>el.size,v=>{up({size:v});buildPanel();})));
    s.appendChild(row('',range(20,110,1,()=>el.size,(v,f)=>up({size:v},f),v=>v+' px')));
    const tg=h('div','seg');
    [['bold','<b>B</b>','bold'],['italic','<i>I</i>','italic'],['underline','<u>U</u>','underline']].forEach(a=>{
      const b=h('button',el[a[2]]?'on':'',a[1]);b.type='button';b.title='Dica: selecione parte do texto ao editar para formatar só ela';b.onmousedown=e=>e.preventDefault();
      b.onclick=()=>{if(hasSel()){document.execCommand(a[0]);}else{up({[a[2]]:!el[a[2]]});b.classList.toggle('on',el[a[2]]);}};tg.appendChild(b);
    });
    s.appendChild(row('Estilo',tg));s.appendChild(alignSeg());
    s.appendChild(row('Lista',seg([['','—','Sem lista'],['ul','•','Marcadores'],['ol','1.','Numerada']],()=>el.list,v=>up({list:v}))));
    s.appendChild(row('Espaço entre linhas',seg([[1.2,'Junto'],[1.4,'Normal'],[1.7,'Aberto']],()=>el.lh,v=>up({lh:v}))));
    s.appendChild(row('Cor do texto',colorCtl(()=>el.color,(c,f)=>{
      if(!c)return;if(f&&hasSel()){document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,c);}else up({color:c},f);
    })));
    p.appendChild(s);
    s=sec('Caixa de fundo');
    s.appendChild(row('Cor da caixa',colorCtl(()=>el.bg,(c,f)=>up({bg:c},f),SWBOX)));
    s.appendChild(row('Transparência',range(.2,1,.05,()=>el.bgop,(v,f)=>up({bgop:v},f),v=>Math.round(v*100)+'%')));
    s.appendChild(row('Cantos arredondados',range(0,60,2,()=>el.radius,(v,f)=>up({radius:v},f),v=>v+' px')));p.appendChild(s);
  }
  if(el.type==='image'){
    const s=sec('Imagem');s.appendChild(btn2(ic('image',16)+' '+(el.asset?'Trocar imagem':'Escolher imagem'),()=>replaceImage(el),'pri'));
    s.appendChild(row('Ajuste',seg([['contain','Inteira'],['cover','Preencher']],()=>el.fit,v=>up({fit:v}))));
    s.appendChild(row('Cantos arredondados',range(0,200,2,()=>el.radius,(v,f)=>up({radius:v},f),v=>v+' px')));
    s.appendChild(row('Moldura',seg([['none','Sem'],['shadow','Sombra'],['border','Borda']],()=>el.frame,v=>up({frame:v}))));p.appendChild(s);
  }
  if(el.type==='video'){
    const s=sec('Vídeo');s.appendChild(btn2(ic('video',16)+' '+((el.asset||el.src)?'Trocar vídeo':'Adicionar vídeo'),()=>videoModal(el),'pri'));
    s.appendChild(row('Cantos arredondados',range(0,100,2,()=>el.radius,(v,f)=>up({radius:v},f),v=>v+' px')));
    s.appendChild(row('Moldura',seg([['none','Sem'],['shadow','Sombra'],['border','Borda']],()=>el.frame,v=>up({frame:v}))));
    s.appendChild(h('div','hint','O vídeo toca no modo <b>Apresentar</b>.'));p.appendChild(s);
  }
  if(el.type==='audio'){
    const s=sec('Áudio');s.appendChild(btn2(ic('audio',16)+' '+(el.asset?'Trocar áudio':'Escolher áudio'),()=>replaceAudio(el),'pri'));
    s.appendChild(h('div','hint','O player de áudio aparece no modo <b>Apresentar</b>.'));p.appendChild(s);
  }
  if(el.type==='shape'){
    const s=sec('Forma');s.appendChild(row('Cor de preenchimento',colorCtl(()=>el.fill,(c,f)=>up({fill:c||'#ffffff'},f))));
    s.appendChild(row('Cor da borda',colorCtl(()=>el.stroke,(c,f)=>up({stroke:c||'#ffffff'},f))));
    s.appendChild(row('Espessura da borda',range(0,20,1,()=>el.sw,(v,f)=>up({sw:v},f),v=>v+' px')));p.appendChild(s);
  }
  if(el.type==='sticker')p.appendChild(h('div','hint','Arraste os cantos para aumentar ou diminuir a figurinha.'));

  const s=sec('Posição e aparência');
  s.appendChild(row('Opacidade',range(.1,1,.05,()=>el.op,(v,f)=>up({op:v},f),v=>Math.round(v*100)+'%')));
  s.appendChild(row('Rotação',range(-180,180,1,()=>el.rot,(v,f)=>up({rot:v},f),v=>v+'°')));
  const z=h('div','two');z.appendChild(btn2(ic('up',16)+' Frente',()=>moveZ('front')));z.appendChild(btn2(ic('down',16)+' Atrás',()=>moveZ('back')));s.appendChild(z);
  const a=h('div','two');a.appendChild(btn2(ic('copy',16)+' Duplicar',dupEl));a.appendChild(btn2(ic('trash',16)+' Excluir',delEl,'dng'));s.appendChild(a);

/* ---------- salvar ---------- */
function slug(t){return (t||'aula').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'aula';}
function exportHTML(){
  endEdit();const assets={};usedAssets().forEach(k=>{assets[k]=state.assets[k];});
  const json=JSON.stringify({v:1,title:state.title,slides:state.slides,assets:assets}).replace(/</g,'\\u003c');
  const out=PRISTINE
    .replace(/(<script type="application\/json" id="deck-data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b)
    .replace(/<title>[\s\S]*?<\/title>/,()=>'<title>'+esc(state.title)+'</title>');
  const blob=new Blob([out],{type:'text/html;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=slug(state.title)+'.html';document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},3000);
  unsaved=false;toast('Aula salva: '+a.download+' ('+fmtSize(blob.size)+')');
}

/* ---------- apresentação ---------- */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
const FSOK=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function openPlayer(start,standalone){
  endEdit();closePop();playerOpen=true;
  let i=clamp(start,0,state.slides.length-1),idle=null,ro=null,swiped=false;
  const canFs=FSOK(),canEdit=standalone&&!EMBED;
  const ov=h('div','player'+(EMBED?' emb':''));ov.tabIndex=-1;
  ov.innerHTML='<div class="pbar"><i></i></div><div class="pstage"></div>'
   +'<button class="pnav pl" aria-label="Slide anterior">'+ic('chevL',30)+'</button><button class="pnav pr" aria-label="Próximo slide">'+ic('chevR',30)+'</button>'
   +'<div class="pnotes"></div>'
   +'<div class="pctl"><span class="pcnt"></span>'
   +(standalone?'':'<button data-a="notes" title="Notas (N)">'+ic('notes',18)+'</button>')
   +(canFs?'<button data-a="fs" title="Tela cheia (F)" aria-label="Tela cheia">'+ic('max',18)+'</button>':'')
   +(!standalone?'<button data-a="exit">'+ic('x',16)+' Sair</button>':(canEdit?'<button data-a="exit">'+ic('edit',16)+' Editar</button>':''))
   +'</div>';
  $('#app').appendChild(ov);
  const stage=$('.pstage',ov),total=state.slides.length;
  const focusMe=()=>{try{window.focus();ov.focus({preventScroll:true});}catch(e){}};
  const fit=()=>{const cw=ov.clientWidth,ch=ov.clientHeight;if(!cw||!ch)return;stage.style.transform='translate(-50%,-50%) scale('+Math.min(cw/W,ch/H)+')';};
  const show=(n,dir)=>{
    i=clamp(n,0,total-1);const sl=state.slides[i],node=renderSlideNode(sl,'play'),tr=sl.trans||'fade';
    if(tr!=='none')node.style.animation='a-'+(tr==='slide'&&dir<0?'slideb':tr)+' .45s ease both';
    stage.innerHTML='';stage.appendChild(node);
    $('.pbar i',ov).style.width=((i+1)/total*100)+'%';$('.pcnt',ov).textContent=(i+1)+' / '+total;
    $('.pnotes',ov).textContent=sl.notes||'(sem notas neste slide)';
    $('.pl',ov).style.visibility=i?'visible':'hidden';$('.pr',ov).style.visibility=i<total-1?'visible':'hidden';
  };
  const next=()=>{if(i<total-1)show(i+1,1);},prev=()=>{if(i>0)show(i-1,-1);};
  const fs=()=>{
    try{
      if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
      else{const r=ov.requestFullscreen||ov.webkitRequestFullscreen;if(r){const p=r.call(ov);if(p&&p.catch)p.catch(()=>{});}}
    }catch(e){}
  };
  const close=()=>{
    document.removeEventListener('keydown',kd,true);removeEventListener('resize',fit);
    document.removeEventListener('fullscreenchange',fit);document.removeEventListener('webkitfullscreenchange',fit);
    if(ro)ro.disconnect();
    try{if(fsEl())(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(e){}
    clearTimeout(idle);ov.remove();playerOpen=false;if(!standalone)goSlide(i);else fitStage();
  };
  function kd(e){
    const k=e.key;let used=true;
    if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter')next();
    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace')prev();
    else if(k==='Home')show(0,-1);else if(k==='End')show(total-1,1);
    else if((k==='f'||k==='F')&&canFs)fs();
    else if((k==='n'||k==='N')&&!EMBED)$('.pnotes',ov).classList.toggle('on');
    else if(k==='Escape'&&!standalone)close();
    else used=false;
    if(used){e.preventDefault();e.stopPropagation();}
  }
  document.addEventListener('keydown',kd,true);addEventListener('resize',fit);
  document.addEventListener('fullscreenchange',fit);document.addEventListener('webkitfullscreenchange',fit);
  if(window.ResizeObserver){ro=new ResizeObserver(fit);ro.observe(ov);}
  $('.pl',ov).onclick=e=>{e.stopPropagation();prev();};$('.pr',ov).onclick=e=>{e.stopPropagation();next();};
  ov.querySelector('.pctl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='exit')close();else if(a==='fs')fs();else if(a==='notes')$('.pnotes',ov).classList.toggle('on');});
  stage.addEventListener('click',e=>{if(swiped||e.target.closest('video,audio,iframe,a'))return;next();});
  let sx=null;
  const wake=()=>{ov.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>ov.classList.add('idle'),2800);};
  ov.addEventListener('pointerdown',e=>{sx=e.clientX;wake();focusMe();});
  ov.addEventListener('pointerup',e=>{if(sx==null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>60){swiped=true;setTimeout(()=>{swiped=false;},350);d<0?next():prev();}});
  ov.addEventListener('pointercancel',()=>{sx=null;});
  ov.addEventListener('pointermove',wake);wake();
  fit();show(i,1);focusMe();
  if(!standalone&&canFs)fs();
}

/* ---------- inicialização ---------- */
function buildShell(){
  $('#app').innerHTML=
'<div class="shell">'
+'<header class="top"><div class="brand"><div class="logo">'+ic('book',22)+'</div><div><b>Aula Criativa</b><small>Editor de slides</small></div></div>'
+'<input id="deckTitle" class="dtitle" spellcheck="false" aria-label="Título da aula" placeholder="Nome da aula">'
+'<div class="sp"></div>'
+'<button class="ib" id="bUndo" title="Desfazer (Ctrl+Z)">'+ic('undo')+'</button><button class="ib" id="bRedo" title="Refazer (Ctrl+Y)">'+ic('redo')+'</button>'
+'<span class="fsize" id="fsize"></span>'
+'<button class="btn play" id="bPlay">'+ic('play',18)+' Apresentar</button>'
+'<button class="btn ghost" id="bAva" title="Como usar dentro do AVA (iframe)">'+ic('link',18)+' Usar no AVA</button>'
+'<button class="btn save" id="bSave" title="Salvar (Ctrl+S)">'+ic('download',18)+' Salvar aula (.html)</button></header>'
+'<nav class="ribbon">'
+'<button class="rb" id="rTitle">'+ic('type',24)+'Título</button><button class="rb" id="rText">'+ic('text',24)+'Texto</button><div class="rsep"></div>'
+'<button class="rb" id="rImg">'+ic('image',24)+'Imagem</button><button class="rb" id="rVid">'+ic('video',24)+'Vídeo</button><button class="rb" id="rAud">'+ic('audio',24)+'Áudio</button><div class="rsep"></div>'
+'<button class="rb" id="rShape">'+ic('shapes',24)+'Formas</button><button class="rb" id="rSticker">'+ic('smile',24)+'Figurinhas</button>'
+'<span class="rhint">Atalhos: Ctrl+Z desfaz · Delete apaga · setas movem · arraste imagens para o slide</span></nav>'
+'<main class="work"><aside class="slides"><div id="slist"></div><button class="addsl" id="bAdd">'+ic('plus',18)+' Novo slide</button></aside>'
+'<section class="canvas" id="canvas"><div class="stagebox" id="stagebox"></div></section><aside class="props" id="props"></aside></main></div>'
+'<div id="toasts"></div>';
  stageBox=$('#stagebox');
  const T=()=>THEMES[slide().theme]||THEMES.sky;
  $('#rTitle').onclick=()=>{endEdit();addEl(mkTitle(T()),true);};
  $('#rText').onclick=()=>{endEdit();addEl(mkText(T()),true);};
  $('#rImg').onclick=async()=>{closePop();addImages(await pick('image/*',true));};
  $('#rVid').onclick=()=>{closePop();videoModal(null);};
  $('#rAud').onclick=()=>{closePop();addAudio();};
  $('#rShape').onclick=e=>shapePop(e.currentTarget);
  $('#rSticker').onclick=e=>stickerPop(e.currentTarget);
  $('#bAdd').onclick=templatesModal;
  $('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
  $('#bPlay').onclick=()=>openPlayer(cur,false);
  $('#bSave').onclick=exportHTML;$('#bAva').onclick=avaModal;
  $('#deckTitle').oninput=e=>{state.title=e.target.value;unsaved=true;clearTimeout(tmr);tmr=setTimeout(autosave,600);};
  if(window.ResizeObserver)new ResizeObserver(fitStage).observe($('#canvas'));else addEventListener('resize',fitStage);

  const cv=$('#canvas');
  cv.addEventListener('dragover',e=>{if(e.dataTransfer&&[].indexOf.call(e.dataTransfer.types,'Files')>=0)e.preventDefault();});
  cv.addEventListener('drop',async e=>{
    const fs=e.dataTransfer?[].slice.call(e.dataTransfer.files):[];if(!fs.length)return;e.preventDefault();
    for(const f of fs){
      if(f.type.indexOf('image/')===0)await addImages([f]);
      else if(f.type.indexOf('video/')===0){toast('Lendo vídeo…');const id='a'+uid();state.assets[id]=await readDataURL(f);addEl(mkVideo({kind:'file',asset:id,name:f.name}));updateSize();}
      else if(f.type.indexOf('audio/')===0){const r=await audioFrom(f);if(r)addEl(mkAudio(r));}
    }
  });
  document.addEventListener('paste',e=>{
    if(playerOpen||editingId||(e.target.closest&&e.target.closest('input,textarea,[contenteditable="true"]')))return;
    const fs=[].slice.call((e.clipboardData&&e.clipboardData.files)||[]).filter(f=>f.type.indexOf('image/')===0);
    if(fs.length){e.preventDefault();addImages(fs);}
  });
  document.addEventListener('keydown',e=>{
    if(playerOpen)return;
    const mod=e.ctrlKey||e.metaKey,k=(e.key||'').toLowerCase();
    if(mod&&k==='s'){e.preventDefault();exportHTML();return;}
    const t=e.target;if(t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))return;
    if(mod){if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();}else if(k==='y'){e.preventDefault();redo();}else if(k==='d'&&selId){e.preventDefault();dupEl();}return;}
    if((e.key==='Delete'||e.key==='Backspace')&&selId){e.preventDefault();delEl();return;}
    if(selId&&e.key.indexOf('Arrow')===0){
      e.preventDefault();const el=findEl(selId),n=nodeOf(selId);if(!el)return;const d=e.shiftKey?10:1;
      if(e.key==='ArrowLeft')el.x-=d;if(e.key==='ArrowRight')el.x+=d;if(e.key==='ArrowUp')el.y-=d;if(e.key==='ArrowDown')el.y+=d;
      styleNode(n,el);updateSel();clearTimeout(nudgeT);nudgeT=setTimeout(commit,400);return;
    }
    if(e.key==='Escape'){select(null);return;}
    if(e.key==='PageDown'){goSlide(cur+1);}if(e.key==='PageUp'){goSlide(cur-1);}
  });
  addEventListener('beforeunload',e=>{if(unsaved&&!playerOpen){e.preventDefault();e.returnValue='';}});
  try{document.execCommand('defaultParagraphSeparator',false,'div');}catch(e){}
}
let nudgeT=null;
function init(){
  cur=0;selId=null;hist=[JSON.stringify(state.slides)];hi=0;unsaved=false;
  $('#deckTitle').value=state.title;renderSlides();fitStage();renderStage();buildPanel();updateSize();updateUndo();
}
function readAuto(){try{const r=JSON.parse(localStorage.getItem(AK)||'null');if(r&&r.state&&r.state.slides&&r.state.slides.length)return r;}catch(e){}return null;}
function copyText(t){
  const fallback=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-999px;top:0';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();toast(ok?'Código copiado!':'Não consegui copiar. Selecione o texto e use Ctrl+C.');};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Código copiado!'),fallback);else fallback();
}
function avaModal(){
  const code='<iframe src="COLE_AQUI_O_LINK_DO_ARQUIVO" title="'+esc(state.title)+'" style="width:100%;aspect-ratio:16/9;border:0;border-radius:8px" allow="fullscreen; autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>';
  const b=h('div','',
    '<p><b>1.</b> Clique em <b>Salvar aula (.html)</b>. Tudo (textos, imagens, vídeos e áudios) fica dentro de um único arquivo.</p>'
   +'<p><b>2.</b> Envie esse arquivo para o AVA (ou para qualquer hospedagem) e copie o <b>link direto</b> dele.</p>'
   +'<p><b>3.</b> No editor do AVA, abra o modo <b>código-fonte</b> (botão &lt;/&gt;) e cole o código abaixo, trocando o link:</p>');
  const ta=h('textarea','fld');ta.readOnly=true;ta.value=code;ta.rows=5;ta.style.cssText='font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px';ta.onfocus=()=>ta.select();b.appendChild(ta);
  b.appendChild(h('p','','Dentro do iframe a aula abre direto na apresentação, se ajusta ao tamanho do quadro, funciona com toque e teclado e <b>não mostra o botão de edição</b> ao aluno. Para editar de novo, abra o arquivo .html direto no navegador e clique em <b>Editar</b>.'));
  b.appendChild(h('p','','<b>Atenção:</b> o AVA precisa permitir iframe e JavaScript. Vídeos do YouTube/Vimeo precisam de internet; vídeos enviados ficam dentro do arquivo e podem passar do limite de upload do AVA. Teste primeiro com uma aula pequena.'));
  modal('Usar esta aula dentro do AVA',b,[{label:'Fechar'},{label:'Copiar código',pri:true,fn:()=>copyText(code)}]);
}
const loadDeck=e=>({title:e.title||'Aula',slides:e.slides,assets:e.assets||{}});
function boot(){
  let emb=null;try{emb=JSON.parse($('#deck-data').textContent||'null');}catch(e){}
  const has=!!(emb&&emb.slides&&emb.slides.length);
  if(has&&EMBED){
    /* dentro de iframe (AVA): somente a apresentação, sem editor */
    document.body.style.background='#0b0c1a';state=loadDeck(emb);document.title=state.title;openPlayer(0,true);return;
  }
  buildShell();
  if(has){state=loadDeck(emb);init();document.title=state.title;openPlayer(0,true);return;}
  state=newDeck();init();
  const saved=readAuto();
  if(saved){
    const b=h('div');b.appendChild(h('p','','Encontramos um rascunho salvo automaticamente neste navegador ('+esc(new Date(saved.t).toLocaleString('pt-BR'))+'). Deseja continuar de onde parou?'));
    modal('Continuar a aula anterior?',b,[{label:'Começar do zero',fn:()=>{try{localStorage.removeItem(AK);}catch(e){}}},{label:'Continuar rascunho',pri:true,fn:()=>{const s=saved.state;state={title:s.title||'Minha aula',slides:s.slides,assets:s.assets||{}};init();}}]);
  }
}
boot();
})();
